<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundo Prime</title>
<style>
body{font-family:Arial;background:#0f0f0f;color:#fff;text-align:center;padding:20px}
.card{background:#1a1a1a;border-radius:15px;padding:20px;margin:10px}
.big{font-size:40px;color:#00ff88}
button{background:#00ff88;border:none;padding:15px 25px;font-size:18px;border-radius:10px;font-weight:bold}
</style>
</head>
<body>

<h1>🌍 MUNDO PRIME</h1>

<div class="card">
  <p>CLICS TOTALES</p>
  <div class="big" id="clics">3652</div>
</div>

<div class="card">
  <p>GANADO TOTAL</p>
  <div class="big">$<span id="dinero">1.76</span></div>
</div>

<div class="card">
  <p>Para ti (30%)</p>
  <b>$<span id="mio">0.53</span></b><br><br>
  <p>Para pagar (70%)</p>
  <b>$<span id="pagar">1.23</span></b>
</div>

<br>
<button id="btn-link">DAR CLIC AQUÍ 🔗</button>

<script>
const UPSTASH_URL = "PEGA_AQUI_TU_URL";
const UPSTASH_TOKEN = "PEGA_AQUI_TU_TOKEN";

const BASE_CLICS = 3652;
const BASE_DINERO = 1.76;
const VALOR = BASE_DINERO / BASE_CLICS;

async function actualizar() {
  try {
    const r = await fetch(UPSTASH_URL + "/get/clics_extra", {
      headers: { Authorization: "Bearer " + UPSTASH_TOKEN }
    });
    const d = await r.json();
    const extra = parseInt(d.result || 0);
    mostrar(BASE_CLICS + extra);
  } catch(e) {
    let extra = parseInt(localStorage.getItem("extra") || 0);
    mostrar(BASE_CLICS + extra);
  }
}

function mostrar(clics) {
  const dinero = clics * VALOR;
  document.getElementById("clics").textContent = clics;
  document.getElementById("dinero").textContent = dinero.toFixed(2);
  document.getElementById("mio").textContent = (dinero * 0.30).toFixed(2);
  document.getElementById("pagar").textContent = (dinero * 0.70).toFixed(2);
}

document.getElementById("btn-link").addEventListener("click", async () => {
  try {
    await fetch(UPSTASH_URL + "/incr/clics_extra", {
      headers: { Authorization: "Bearer " + UPSTASH_TOKEN }
    });
  } catch(e) {
    let extra = parseInt(localStorage.getItem("extra") || 0) + 1;
    localStorage.setItem("extra", extra);
  }
  actualizar();
});

// Cada 2 segundos, en silencio, sin decir EN VIVO
setInterval(actualizar, 2000);
actualizar();
</script>

</body>
</html>
